            - generic [ref=f1e90]:
              - paragraph [ref=f1e91]:
                - emphasis [ref=f1e92]: Last updated February 15, 2024
              - paragraph [ref=f1e93]:
                - text: Google API Services, including Google Sign-In, are part of an authentication and authorization framework that gives you, the developer, the ability to connect directly with Google users when you would like to request access to Google user data. The policy below, as well as the
                - link "Google APIs Terms of Service" [ref=f1e94] [cursor=pointer]:
                  - /url: /terms
                - text: ", govern the use of Google API Services when you request access to Google user data. Please check back from time to time as these policies are occasionally updated."
              - heading [level=2] [ref=f1e95]:
                - heading "Accurately represent your identity and intent" [level=2] [ref=f1e96]
                - 'button "Copy link to this section: Accurately represent your identity and intent" [ref=f1e97] [cursor=pointer]': link
              - paragraph [ref=f1e98]: "If you wish to access Google user data you must provide Google users and Google with clear and accurate information regarding your use of Google API Services. This includes, without limitation, requirements to accurately represent:"
              - list [ref=f1e99]:
                - listitem [ref=f1e100]:
                  - strong [ref=f1e101]: Who is requesting Google user data?
                  - text: All permission requests must accurately represent the identity of the application that seeks access to user data. If you have obtained authorized client credentials to access Google API Services, keep these credentials confidential.
                - listitem [ref=f1e102]:
                  - strong [ref=f1e103]: What data are you requesting?
                  - text: You must provide clear and accurate information explaining the types of data being requested. In addition, if you plan to access or use a type of user data that was not originally disclosed in your privacy policy (or in-product disclosures) when a Google user initially authorized access, you must update your privacy policy and prompt the user to consent to any changes before you may access that data.
                - listitem [ref=f1e104]:
                  - strong [ref=f1e105]: Why are you requesting Google user data?
                  - text: Be honest and transparent with users when you explain the purpose for which your application requests user data. If your application requests data for one reason but the data will also be utilized for a secondary purpose, you must notify Google users of both use cases. As a general matter, users should be able to readily understand the value of providing the data that your application requests, as well as the consequences of sharing that data with your application.
              - heading "Be transparent about the data you access with clear and prominent privacy disclosures" [level=2] [ref=f1e106]
              - paragraph [ref=f1e107]: You must publish a privacy policy that fully documents how your application interacts with user data. You must list the privacy policy URL in your OAuth client configuration when your application is made available to the public.
              - paragraph [ref=f1e108]:
                - strong [ref=f1e109]: Your Privacy Policy and all in-product privacy notifications should be accurate, comprehensive, and easily accessible.
                - text: Your privacy policy and in-product privacy notifications must thoroughly disclose the manner in which your application accesses, uses, stores, or shares Google user data. Your use of Google user data must be limited to the practices explicitly disclosed in your published privacy policy, but you should consider the use of additional in- product notifications to ensure that users understand how your application will handle user data. If you change the way your application uses Google user data, you must notify users and prompt them to consent to an updated privacy policy before you make use of Google user data in a new way or for a different purpose than originally disclosed.
              - paragraph [ref=f1e110]:
                - strong [ref=f1e111]: Disclosures about data use should be prominent and timely.
                - text: Your privacy policy and any in-product notifications regarding data use should be prominently displayed in your application interface so that users can find this information easily. Where possible, disclosures about data use should be timely and shown in context.
              - heading "Request the minimum relevant permissions" [level=2] [ref=f1e112]
              - paragraph [ref=f1e113]: Permission requests should make sense to users, and should be limited to the critical information necessary to implement your application.
              - paragraph [ref=f1e114]:
                - strong [ref=f1e115]: Don't request access to information that you don't need.
                - text: Only request access to the permissions necessary to implement your application's features or services. If your application does not require access to specific permissions, then you must not request access to these permissions. Don't attempt to "future proof" your access to user data by requesting access to information that might benefit services or features that have not yet been implemented.
              - paragraph [ref=f1e116]:
                - strong [ref=f1e117]: Request permissions in context where possible.
                - text: Only request access to user data in context (via incremental auth) whenever you can, so that users understand why you need the data.
              - heading "Deceptive or unauthorized use of Google API Services is prohibited" [level=2] [ref=f1e118]
              - paragraph [ref=f1e119]: "You are strictly prohibited from engaging in any activity that may deceive users or Google about your use of Google API Services. This includes without limitation the following requirements:"
              - paragraph [ref=f1e120]:
                - strong [ref=f1e121]: Do not misrepresent what data is collected or what you do with Google user data.
                - text: Be up front with users so that they can make an informed decision to grant authorization. You must disclose all user data that you access, use, store, delete, or share, as well as any actions you take on a user's behalf.
              - paragraph [ref=f1e122]: You are not permitted to access, aggregate, or analyze Google user data if the data will be displayed, sold, or otherwise distributed to a third party conducting surveillance.
              - paragraph [ref=f1e123]: "Overall there should be no surprises for Google users: hidden features, services, or actions that are inconsistent with the marketed purpose of your application may lead Google to suspend your ability to access Google API Services."
              - paragraph [ref=f1e124]:
                - strong [ref=f1e125]: Do not mislead Google about an application's operating environment.
                - text: You must accurately represent the environment in which the authentication page appears. For example, don't claim to be an Android application in the user agent header if your application is running on iOS, or represent that your application's authentication page is rendered in a desktop browser if instead the authentication page is rendered in an embedded web view.
              - paragraph [ref=f1e126]:
                - strong [ref=f1e127]: Do not use undocumented APIs without express permission.
                - text: Don't reverse engineer undocumented Google API Services or otherwise attempt to derive or use the underlying source code of undocumented Google API Services. You may only access data from Google API Services according to the means stipulated in the official documentation of that API Service, as provided on Google's
                - link "Developer Page" [ref=f1e128] [cursor=pointer]:
                  - /url: https://developers.google.com/
                - text: .
              - paragraph [ref=f1e129]:
                - strong [ref=f1e130]: Do not make false or misleading statements about any entities that have allegedly authorized or managed your application.
                - text: You must accurately represent the company, organization, or other authority that manages your application. Making false representations about client credentials to Google or Google users is grounds for suspension.
              - heading "Child-directed apps" [level=2] [ref=f1e131]
              - paragraph [ref=f1e132]:
                - text: The Children's Online Privacy Protection Act, or
                - link "COPPA" [ref=f1e133] [cursor=pointer]:
                  - /url: https://www.ftc.gov/tips-advice/business-center/privacy-and-security/children%27s-privacy
                - text: ", applies to websites, apps, and services directed to children under the age of 13 and general audience apps, websites, or services with users known to be under the age of 13. While"
                - link "child-directed apps may use some Google services" [ref=f1e134] [cursor=pointer]:
                  - /url: https://play.google.com/about/families/coppa-compliance/child-directed/
                - text: ", developers are responsible for using these services according to their obligations under the law. Please review the FTC's guidance on COPPA (including information about the differences between mixed audience apps and apps directed primarily to children from the"
                - link "FTC's website" [ref=f1e135] [cursor=pointer]:
                  - /url: https://www.ftc.gov/tips-advice/business-center/guidance/complying-coppa-frequently-asked-questions
                - text: ) and consult with your own legal counsel.
              - paragraph [ref=f1e136]:
                - strong [ref=f1e137]: "Child-directed apps:"
                - text: If your application is directed primarily at children, it should not use Google Sign-In or any other Google API Service that accesses data associated with a Google Account. This restriction includes Google Play Games Services and any other Google API Service using the OAuth technology for authentication and authorization.
              - paragraph [ref=f1e138]:
                - strong [ref=f1e139]: "Mixed audience apps:"
                - text: Applications that are mixed audience shouldn't require users to sign in to a Google Account, but can offer, for example, Google Sign-In or Google Play Games Services as an optional feature. In these cases, users must be able to access the application in its entirety without signing into a Google Account.
              - heading "Maintain a secure operating environment" [level=2] [ref=f1e140]
              - paragraph [ref=f1e141]: We expect all user data is secure in transit and at rest. Take reasonable and appropriate steps to protect all applications or systems that make use of Google API Service and any data derived from it against unauthorized or unlawful access, use, destruction, loss, alteration, or disclosure.
              - heading "Additional Requirements for Specific API Scopes" [level=2] [ref=f1e142]
              - paragraph [ref=f1e143]:
                - text: Certain Google OAuth API Scopes (the "
                - link "Sensitive" [ref=f1e144] [cursor=pointer]:
                  - /url: https://support.google.com/cloud/answer/9110914#sensitive-scopes
                - text: and
                - link "Restricted" [ref=f1e145] [cursor=pointer]:
                  - /url: https://support.google.com/cloud/answer/9110914#restricted-scopes
                - text: Scopes") are subject to additional requirements that can be found in each product's User Data and Developer Policy or the
                - link "Google Developer Page" [ref=f1e146] [cursor=pointer]:
                  - /url: https://developers.google.com/
                - text: . More information about the requirements to obtain (or keep) access to these scopes is also available in the
                - link "OAuth Application Verification FAQ" [ref=f1e147] [cursor=pointer]:
                  - /url: https://support.google.com/cloud/answer/9110914#restricted-scopes
                - text: .
              - blockquote [ref=f1e148]:
                - paragraph [ref=f1e149]:
                  - strong [ref=f1e150]: "Note:"
                  - text: If your app is only used by users within your own domain, then these requirements do not apply.
                  - link "Google Workspace" [ref=f1e151] [cursor=pointer]:
                    - /url: https://support.google.com/a/topic/29157?ref_topic=7570177
                  - text: can control access to connected applications
                  - link "via allowlisting" [ref=f1e152] [cursor=pointer]:
                    - /url: https://support.google.com/a/answer/7281227
                  - text: . Learn more about
                  - link "best practices" [ref=f1e153] [cursor=pointer]:
                    - /url: https://cloud.google.com/blog/products/g-suite/take-charge-your-oauth-ecosystem-these-best-practices
                  - text: for managing your enterprise OAuth ecosystem.
              - paragraph [ref=f1e154]:
                - strong [ref=f1e155]: "Unless stated otherwise in the product's User Data and Developer Policy, additional requirements include:"
              - list [ref=f1e156]:
                - listitem [ref=f1e157]:
                  - paragraph [ref=f1e158]:
                    - strong [ref=f1e159]: "Appropriate Access:"
                    - text: Developers may only request access to the scopes for a permitted Application Type described by the product. Such application types can be found under an Appropriate Access heading in the product specific policy or the product's
                    - link "Google Developer Page" [ref=f1e160] [cursor=pointer]:
                      - /url: https://developers.google.com/
                    - text: .
                - listitem [ref=f1e161]:
                  - paragraph [ref=f1e162]:
                    - strong [ref=f1e163]: "Limited Use:"
                    - text: Your use of data obtained via the product's specified scopes must comply with the below requirements. These requirements apply to the raw data obtained from the scopes and data aggregated, anonymized, or derived from them.
                  - list [ref=f1e164]:
                    - listitem [ref=f1e165]:
                      - paragraph [ref=f1e166]: Limit your use of data to providing or improving user-facing features that are prominent in the requesting application's user interface;
                    - listitem [ref=f1e167]:
                      - paragraph [ref=f1e168]: "Transfers of data are not allowed, except:"
                      - list [ref=f1e169]:
                        - listitem [ref=f1e170]: To provide or improve your appropriate access or user-facing features that are visible and prominent in the requesting application's user interface and only with the user's consent;
                        - listitem [ref=f1e171]: For security purposes (for example, investigating abuse);
                        - listitem [ref=f1e172]: To comply with applicable laws; or,
                        - listitem [ref=f1e173]: As part of a merger, acquisition, or sale of assets of the developer after obtaining explicit prior consent from the user.
                    - listitem [ref=f1e174]:
                      - paragraph [ref=f1e175]: "Don't allow humans to read the data, unless:"
                      - list [ref=f1e176]:
                        - listitem [ref=f1e177]: You first obtained the user's affirmative agreement to view specific messages, files, or other data, with the limited exception of use cases approved by Google under additional terms applicable to the Nest Device Access program;
                        - listitem [ref=f1e178]: It is necessary for security purposes (for example, investigating a bug or abuse);
                        - listitem [ref=f1e179]: It is necessary to comply with applicable law; or
                        - listitem [ref=f1e180]: The data (including derivations) is aggregated and used for internal operations in accordance with applicable privacy and other jurisdictional legal requirements.
                  - paragraph [ref=f1e181]: "All other transfers, uses, or sales of user data are prohibited, including:"
                  - list [ref=f1e182]:
                    - listitem [ref=f1e183]: Transferring or selling user data to third parties like advertising platforms, data brokers, or any information resellers.
                    - listitem [ref=f1e184]: Transferring, selling, or using user data for serving ads, including retargeting, personalized or interest-based advertising.
                    - listitem [ref=f1e185]: Transferring, selling, or using user data to determine credit-worthiness or for lending purposes.
                  - paragraph [ref=f1e186]: You must ensure that your employees, agents, contractors, and successors comply with this Google API Services User Data Policy.
                - listitem [ref=f1e187]:
                  - paragraph [ref=f1e188]:
                    - strong [ref=f1e189]: "Secure Data Handling:"
                    - text: Applications accessing the product specified scopes (the "
                    - link "Sensitive" [ref=f1e190] [cursor=pointer]:
                      - /url: https://support.google.com/cloud/answer/9110914#sensitive-scopes
                    - text: and
                    - link "Restricted" [ref=f1e191] [cursor=pointer]:
                      - /url: https://support.google.com/cloud/answer/9110914#restricted-scopes
                    - text: Scopes") must demonstrate that they adhere to certain security practices. Depending on the API being accessed and number of user grants or users, applications must pass an annual security assessment and obtain a Letter of Assessment from a Google-designated third party. More information about the assessment requirements to obtain or keep access to the scopes is also available in the
                    - link "OAuth Application Verification FAQ" [ref=f1e192] [cursor=pointer]:
                      - /url: https://support.google.com/cloud/answer/9110914#restricted-scopes
                    - text: and the product's
                    - link "Google Developer Page" [ref=f1e193] [cursor=pointer]:
                      - /url: https://developers.google.com/
                    - text: .
              - heading "Enforcement" [level=2] [ref=f1e194]
              - paragraph [ref=f1e195]:
                - text: You must access Google API Services in accordance with the
                - link "Google APIs Terms of Service" [ref=f1e196] [cursor=pointer]:
                  - /url: /terms
                - text: . If you are found to be out of compliance with the
                - link "Google APIs Terms of Service" [ref=f1e197] [cursor=pointer]:
                  - /url: /terms
                - text: ", this Google API Services: User Data Policy, or any Google product policies that are applicable to the Google API Service you are using, Google may revoke or suspend your access to Google API Services and other Google products and services if you are found in violation of other product policies, terms of service, or other guidelines. Your access to Google API Services may also be revoked if your application enables end-users or other parties to violate the Google APIs Terms of Service and/or Google policies."
          - paragraph [ref=f1e199]:
            - text: Except as otherwise noted, the content of this page is licensed under the
            - link "Creative Commons Attribution 4.0 License" [ref=f1e200] [cursor=pointer]:
